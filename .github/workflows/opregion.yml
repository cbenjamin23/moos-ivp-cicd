name: OpRegion regression gate

on:
  pull_request:
    paths:
      - '.github/workflows/opregion.yml'
      - 'CMakeLists.txt'
      - 'tests/**'
      - 'scripts/**'
      - 'config/harness_targets.json'
      - 'harnesses/opregion_harnesses/**'
      - 'harnesses/**/zlaunch.sh'
      - 'missions/opregion_missions/**'
      - 'harnesses/ufield_comms_harnesses/H03-ufield_route_resilience/**'
      - 'harnesses/ufield_comms_harnesses/H01-ufield_comms_unit/**'
      - 'harnesses/ufield_comms_harnesses/H02-ufield_broker_bridge/**'
      - 'missions/ufield_comms_missions/ufield_comms_unit/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/opregion.yml'
      - 'CMakeLists.txt'
      - 'tests/**'
      - 'scripts/**'
      - 'config/harness_targets.json'
      - 'harnesses/opregion_harnesses/**'
      - 'harnesses/**/zlaunch.sh'
      - 'missions/opregion_missions/**'
      - 'harnesses/ufield_comms_harnesses/H03-ufield_route_resilience/**'
      - 'harnesses/ufield_comms_harnesses/H01-ufield_comms_unit/**'
      - 'harnesses/ufield_comms_harnesses/H02-ufield_broker_bridge/**'
      - 'missions/ufield_comms_missions/ufield_comms_unit/**'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'MOOS-IvP SHA or branch to assess (blank uses the validated pin)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: opregion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: cicd
    steps:
      - name: Check out test workspace
        uses: actions/checkout@v6
        with:
          path: cicd
          persist-credentials: false

      - name: Clear inherited mission verdicts
        run: |
          # Tracked results may describe an older local run, not this job.
          rm -f harnesses/opregion_harnesses/H02-opregion_v26/results.txt \
            harnesses/opregion_harnesses/H01-opregion_safety/results.txt \
            harnesses/ufield_comms_harnesses/H03-ufield_route_resilience/results.txt
          rm -f harnesses/ufield_comms_harnesses/H01-ufield_comms_unit/results.txt \
            harnesses/ufield_comms_harnesses/H02-ufield_broker_bridge/results.txt

      - name: Check out upstream candidate
        uses: actions/checkout@v6
        with:
          repository: moos-ivp/moos-ivp
          # Update this pin only after the required and known-issue contracts run.
          ref: ${{ inputs.upstream_ref || '41cd21eecdfc5a7b40c034044d5e96e045b0d05f' }}
          path: moos-ivp
          persist-credentials: false

      - name: Record source revision
        run: |
          set -euo pipefail
          revision=$(git -C ../moos-ivp rev-parse HEAD)
          # shellcheck disable=SC2016
          printf '## OpRegion validation\n\nUpstream revision: `%s`\n' "$revision" >> "$GITHUB_STEP_SUMMARY"
          printf '%s/bin\n%s/scripts\n' "$GITHUB_WORKSPACE/moos-ivp" "$GITHUB_WORKSPACE/moos-ivp" >> "$GITHUB_PATH"

      - name: Install headless build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 lsof patch

      - name: Build upstream without GUI
        working-directory: moos-ivp
        run: |
          set -euo pipefail
          ./build-moos.sh --minrobot --fetch-proj=on -j2
          ./build-ivp.sh --nogui -j2

      - name: Configure and compile regression contracts
        id: contracts
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DMOOSIVP_SOURCE_TREE_BASE="$GITHUB_WORKSPACE/moos-ivp" \
            -DMOOS_DIR="$GITHUB_WORKSPACE/moos-ivp/build/MOOS/MOOSCore" \
            -DMOOSGeodesy_DIR="$GITHUB_WORKSPACE/moos-ivp/build/MOOS/MOOSGeodesy" \
            -DMOOS_ENABLE_KNOWN_ISSUE_TESTS=ON
          cmake --build build --parallel 2 --target \
            ctest-family-opregion ctest-family-opregion-known-issues ctest-family-bhvutil \
            ctest-family-merged-upstream ctest-family-behaviors-colregs ctest-family-helmivp \
            ctest-family-geometry ctest-family-mbutil ctest-family-logutils \
            ctest-family-logstart-known-issues ctest-family-colorpack-known-issues

      - name: Merged upstream CLI and fixture contracts
        env:
          NSPATCH_BINARY: ${{ github.workspace }}/moos-ivp/bin/nspatch
        run: python3 -m unittest discover -s tests -v

      - name: Repository metadata and generated documentation
        run: |
          python3 scripts/check_repo_invariants.py
          python3 scripts/check_cpp_tests.py
          python3 scripts/generate_context_graph.py --check

      - name: Required C++ contracts
        id: required_cpp
        run: |
          python3 scripts/ci_cpp_test_targets.py run --build-dir build \
            --targets opregion,bhvutil,merged-upstream,behaviors-colregs,helmivp,geometry,mbutil,logutils \
            --reports-dir build/opregion-reports \
            --summary-path "$GITHUB_STEP_SUMMARY"

      - name: Known upstream defects (non-blocking, desired-state assertions)
        id: known
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 scripts/ci_cpp_test_targets.py run --build-dir build \
            --targets opregion-known-issues,logstart-known-issues,colorpack-known-issues --reports-dir build/opregion-reports \
            --summary-path "$GITHUB_STEP_SUMMARY"

      - name: V26 mission contracts
        id: v26
        if: ${{ !cancelled() && steps.required_cpp.outcome == 'success' }}
        working-directory: cicd/harnesses/opregion_harnesses/H02-opregion_v26
        run: ./zlaunch.sh --jobs=2 --port_base=22000 --keep_workdirs 10

      - name: V24 compatibility contracts
        id: v24
        if: ${{ !cancelled() && steps.required_cpp.outcome == 'success' }}
        working-directory: cicd/harnesses/opregion_harnesses/H01-opregion_safety
        run: ./zlaunch.sh --jobs=2 --port_base=24000 --keep_workdirs 10

      - name: Runtime shore-route default and opt-in contracts
        id: broker
        if: ${{ !cancelled() && steps.required_cpp.outcome == 'success' }}
        working-directory: cicd/harnesses/ufield_comms_harnesses/H03-ufield_route_resilience
        run: ./zlaunch.sh --jobs=2 --port_base=26000 --keep_workdirs

      - name: Communication contracts
        id: comms
        if: ${{ !cancelled() && steps.required_cpp.outcome == 'success' }}
        working-directory: cicd/harnesses/ufield_comms_harnesses/H01-ufield_comms_unit
        run: ./zlaunch.sh --jobs=2 --port_base=20000 --keep_workdirs

      - name: Core broker and keyword-rejection contracts
        id: core_broker
        if: ${{ !cancelled() && steps.required_cpp.outcome == 'success' }}
        working-directory: cicd/harnesses/ufield_comms_harnesses/H02-ufield_broker_bridge
        # pMediator belongs to moos-ivp-swarm and is tested separately with that dependency.
        run: ./zlaunch.sh --core_only --jobs=2 --port_base=22000 --keep_workdirs

      - name: Summarize known-issue status and mission verdicts
        if: ${{ always() }}
        env:
          KNOWN_OUTCOME: ${{ steps.known.outcome }}
          V26_OUTCOME: ${{ steps.v26.outcome }}
          V24_OUTCOME: ${{ steps.v24.outcome }}
          BROKER_OUTCOME: ${{ steps.broker.outcome }}
          COMMS_OUTCOME: ${{ steps.comms.outcome }}
          CORE_BROKER_OUTCOME: ${{ steps.core_broker.outcome }}
        run: |
          {
          # shellcheck disable=SC2016
          printf '\n### Known upstream defects\n\nOutcome: `%s`. These checks do not block the regression gate; a green gate is not a safety release approval. Promote each contract after its upstream fix.\n' "$KNOWN_OUTCOME"
          # shellcheck disable=SC2016
          printf '\nGeometry, mbutil, and logutils are required checks. The four OpRegion defects, log-start parser defect, and invalid-color initialization defect are non-blocking.\n'
          # shellcheck disable=SC2016
          printf '\nMission steps: V26 `%s`, V24 `%s`, route resilience `%s`, communication `%s`, core broker `%s`.\n' "$V26_OUTCOME" "$V24_OUTCOME" "$BROKER_OUTCOME" "$COMMS_OUTCOME" "$CORE_BROKER_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
          for report in harnesses/opregion_harnesses/H02-opregion_v26/results.txt \
            harnesses/opregion_harnesses/H01-opregion_safety/results.txt \
            harnesses/ufield_comms_harnesses/H03-ufield_route_resilience/results.txt \
            harnesses/ufield_comms_harnesses/H01-ufield_comms_unit/results.txt \
            harnesses/ufield_comms_harnesses/H02-ufield_broker_bridge/results.txt; do
            harness=$(basename "$(dirname "$report")")
            if [[ -f "$report" ]]; then
              {
                printf '\n### %s\n\n```text\n' "$harness"
                tail -n 40 "$report"
                printf '\n```\n'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Preserve reports and mission evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: opregion-regression-evidence
          retention-days: 7
          include-hidden-files: true
          path: |
            cicd/build/opregion-reports/
            cicd/build/Testing/Temporary/
            cicd/harnesses/opregion_harnesses/H*/results.txt
            cicd/harnesses/opregion_harnesses/H*/.harness_runs/
            cicd/harnesses/ufield_comms_harnesses/H03-ufield_route_resilience/results.txt
            cicd/harnesses/ufield_comms_harnesses/H03-ufield_route_resilience/.harness_runs/
            cicd/harnesses/ufield_comms_harnesses/H01-ufield_comms_unit/results.txt
            cicd/harnesses/ufield_comms_harnesses/H01-ufield_comms_unit/.harness_runs/
            cicd/harnesses/ufield_comms_harnesses/H02-ufield_broker_bridge/results.txt
            cicd/harnesses/ufield_comms_harnesses/H02-ufield_broker_bridge/.harness_runs/
